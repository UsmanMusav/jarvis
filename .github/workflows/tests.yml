name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Системные пакеты (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk portaudio19-dev libasound2-dev espeak-ng

      - name: Зависимости
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # PyAudio на части систем не собирается — приложение работает и без него,
          # поэтому при неудаче доставляем остальное и не роняем прогон.
          pip install -r requirements.txt || pip install SpeechRecognition pyttsx3 pygame psutil requests pyautogui

      - name: Тесты
        shell: bash
        run: |
          python tests/test_commands.py
          python tests/test_assistant.py
          python tests/test_updater.py
