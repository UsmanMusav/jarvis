name: probe
on:
  push:
    tags: ['probe-*']
permissions: {}
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        shell: bash
        run: pip install -r requirements.txt || pip install SpeechRecognition pyttsx3 pygame psutil requests pyautogui
      - name: diagnose
        shell: bash
        run: |
          echo "::error::enc=$(python -c 'import sys;print(sys.stdout.encoding)') locale=$(python -c 'import locale;print(locale.getpreferredencoding(False))') pyver=$(python -V)"
          for t in test_commands test_assistant test_updater; do
            python tests/$t.py > p_$t.log 2>&1; echo "::error::$t exit=$?"
            grep -a -E "Error|Успешно|Провалено" p_$t.log | head -2 | sed 's/^/::error::/'
          done
          PYTHONIOENCODING=utf-8 python tests/test_commands.py > p_utf8.log 2>&1; echo "::error::utf8 exit=$?"
          grep -a -E "Успешно|Провалено" p_utf8.log | head -1 | sed 's/^/::error::/'
